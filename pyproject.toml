[project]
name = "stem-splitter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dario Cruz", email = "rio2012@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.5.0",
    "demucs>=4.1.0",
    "librosa>=0.11.0",
    "mutagen>=1.48.1",
    "numpy>=1.26.4",
    "rich>=15.0.0",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
]

[project.scripts]
stems = "stem_splitter:main"
stem-splitter = "stem_splitter:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
